name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-suffix: x86_64-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact-suffix: x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-suffix: x86_64-windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable && rustup target add ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libxcb1-dev \
            libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/ohllama.exe dist/ohllama-${{ github.ref_name }}-${{ matrix.artifact-suffix }}.exe
            mkdir -p dist/pkg
            mv dist/ohllama-${{ github.ref_name }}-${{ matrix.artifact-suffix }}.exe dist/pkg/
          else
            cp target/${{ matrix.target }}/release/ohllama dist/ohllama-${{ github.ref_name }}-${{ matrix.artifact-suffix }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohllama-${{ matrix.artifact-suffix }}
          path: dist
