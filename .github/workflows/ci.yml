name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast lint gate on all platforms.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (lib + bin, unit tests)
        run: cargo test --bin ohllama

  # Compile + unit-test on the three OSes the binary targets.
  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable && rustup target add ${{ matrix.target }}

      # Slint (winit) needs a windowing toolchain on Linux.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libxcb1-dev \
            libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config

      - name: Build
        run: cargo build --target ${{ matrix.target }}

      - name: Test
        run: cargo test --target ${{ matrix.target }} --bin ohllama

  # Verify the CLI help works end-to-end (smoke test, no display needed).
  cli-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup default stable
      - run: cargo build --release
      - name: help
        run: ./target/release/ohllama help
      - name: list (empty)
        run: OHLLAMA_HOME=$(mktemp -d) ./target/release/ohllama list
