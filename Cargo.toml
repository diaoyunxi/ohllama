[package]
name = "ohllama"
version = "0.1.0"
edition = "2021"
description = "Local LLM manager (GUI + CLI + API) with HuggingFace mirror support"
license = "MIT"

[[bin]]
name = "ohllama"
path = "src/main.rs"

[dependencies]
slint = "1.18"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
sysinfo = "0.33"
axum = { version = "0.8", features = ["tokio", "json"] }
tower = { version = "0.5", features = ["util", "timeout"] }
futures = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
url = "2"
walkdir = "2"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
